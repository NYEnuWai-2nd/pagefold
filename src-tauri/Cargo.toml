[package]
name = "pagefold"
version = "0.1.0"
description = "A tiny, offline desktop app to merge, reorder, rotate, delete, extract and split PDF pages visually."
authors = ["Pagefold contributors"]
edition = "2024"

[lib]
name = "pagefold_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
